<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7D84A">
<title>WordQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--y:#F7D84A;--p:#EE8FAE;--l:#C9B3F0;--b:#4EB1EE;--c:#FBF7EE;--k:#1E2233;--g:#8fdc9f;--r:#ee6a62}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font:600 16px/1.35 Manrope,system-ui,sans-serif;color:var(--k);background-color:var(--y);
 background-image:radial-gradient(rgba(30,34,51,.25) 1.5px,transparent 1.7px);background-size:18px 18px;
 padding-bottom:calc(96px + env(safe-area-inset-bottom));user-select:none;-webkit-user-select:none}
#app{max-width:520px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
img{image-rendering:pixelated}
.ic{vertical-align:middle;image-rendering:pixelated}
.px{font-family:'Press Start 2P',monospace}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font:11px/1.3 'Press Start 2P',monospace;background:var(--c);border:3px solid var(--k);box-shadow:3px 3px 0 var(--k);padding:8px 10px;border-radius:8px}
.chips{display:flex;gap:8px}
.chip{display:flex;align-items:center;gap:5px;background:var(--c);border:3px solid var(--k);box-shadow:3px 3px 0 var(--k);border-radius:20px;padding:3px 10px 3px 6px;font-weight:800}
.win{background:var(--c);border:3px solid var(--k);box-shadow:6px 6px 0 var(--k);border-radius:12px;overflow:hidden;margin-bottom:16px}
.tb{display:flex;justify-content:space-between;align-items:center;background:var(--b);border-bottom:3px solid var(--k);padding:7px 10px;font:9px/1 'Press Start 2P',monospace}
.tb.pk{background:var(--p)}.tb.lc{background:var(--l)}
.dots{display:flex;gap:4px}.dots i{width:12px;height:12px;border:2px solid var(--k);background:var(--c);display:block}
.body{padding:16px}
.stage{position:relative;height:256px;background:
 repeating-conic-gradient(var(--l) 0 25%,#d9c9f7 0 50%) 0 0/36px 36px;overflow:hidden}
.portrait{position:absolute;top:0;left:50%;transform:translateX(-50%) scale(1.45);transform-origin:50% 0;z-index:0}
.cat{position:absolute;right:8px;bottom:6px;height:70px;z-index:2;animation:bob 2s infinite steps(2)}
@keyframes bob{50%{transform:translateY(-4px)}}
.dlg{position:relative;background:var(--c);border:3px solid var(--k);box-shadow:6px 6px 0 var(--k);border-radius:12px;padding:22px 16px 14px;margin:6px 0 18px;min-height:92px}
.dlg .nm{position:absolute;top:-14px;left:14px;background:var(--p);border:3px solid var(--k);border-radius:8px;padding:3px 10px;font:9px/1.4 'Press Start 2P',monospace}
#say{font-size:17px;font-weight:700}
.row{display:flex;gap:12px;margin-bottom:16px}.row>*{flex:1}
.btn{font:800 17px Manrope,sans-serif;color:var(--k);background:var(--y);border:3px solid var(--k);box-shadow:4px 4px 0 var(--k);border-radius:12px;padding:12px 14px;cursor:pointer;transition:transform .05s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--k)}
.btn.big{padding:16px 14px;font-size:19px}.btn.pink{background:var(--p)}.btn.blue{background:var(--b)}.btn.lilac{background:var(--l)}.btn.w{width:100%}
.note{background:var(--c);border:3px dashed var(--k);border-radius:12px;padding:10px 14px;margin-bottom:16px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
#nav .bar{pointer-events:auto;width:100%;max-width:492px;background:var(--c);border:3px solid var(--k);box-shadow:5px 5px 0 var(--k);border-radius:20px;display:flex;justify-content:space-around;align-items:center;padding:8px 6px}
.nb{background:none;border:0;font:800 11px Manrope;color:var(--k);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 8px;border-radius:12px;cursor:pointer}
.nb.on{background:var(--y);box-shadow:inset 0 0 0 3px var(--k)}
.nb img{width:28px;height:28px;object-fit:contain}
.plus{position:relative;width:28px;height:28px;display:block}.plus:before,.plus:after{content:'';position:absolute;background:var(--k);left:0;right:0;top:11px;height:6px}.plus:after{left:11px;right:11px;top:0;bottom:0;height:auto}
.fab{width:62px;height:62px;border-radius:50%;background:var(--y);border:3px solid var(--k);box-shadow:4px 4px 0 var(--k);margin-top:-30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.fab:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--k)}
.prog{height:14px;border-bottom:3px solid var(--k);background:var(--c)}.prog b{display:block;height:100%;background:var(--p);border-right:3px solid var(--k);transition:width .3s}
.q{text-align:center;margin:6px 0 16px}.q small{font-weight:800;opacity:.6}.q h2{font-size:34px;margin:6px 0 2px;word-break:break-word}
.ipa{opacity:.75;font-weight:700}
.sp{background:var(--c);border:2px solid var(--k);border-radius:8px;padding:2px 6px;cursor:pointer}
.opts{display:grid;gap:10px}
.opt{font:800 18px Manrope;background:var(--c);color:var(--k);border:3px solid var(--k);box-shadow:3px 3px 0 var(--k);border-radius:12px;padding:12px;cursor:pointer;text-align:center}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--k)}
.opt.ok,.opt.done{background:var(--g)}.opt.no{background:var(--r);color:#fff}.opt.sel{background:var(--y)}.opt:disabled{opacity:1;cursor:default}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mt .col{display:grid;gap:10px;align-content:start}
.inp{width:100%;font:800 22px Manrope;border:3px solid var(--k);border-radius:12px;padding:12px;margin-bottom:12px;background:#fff;text-align:center;user-select:text;-webkit-user-select:text}
.fb{display:flex;align-items:center;gap:10px;background:var(--c);border:3px solid var(--k);box-shadow:4px 4px 0 var(--k);border-radius:12px;padding:8px 10px;margin-bottom:16px}
.fb #mt{height:56px;border:3px solid var(--k);border-radius:8px;background:var(--l)}.fb #mtx{flex:1;font-weight:700}.gcat{height:44px}
.ans{background:var(--y);border:3px solid var(--k);border-radius:12px;padding:10px 12px;margin:12px 0;font-weight:800}
.card{perspective:1100px;height:380px;margin-bottom:16px;touch-action:pan-y}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--c);border:3px solid var(--k);box-shadow:6px 6px 0 var(--k);border-radius:14px;padding:16px;overflow:auto}
.face.front{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--y);text-align:center}
.face.front h1{font-size:40px;margin:6px 0;word-break:break-word}.back{transform:rotateY(180deg)}
.pos{display:inline-block;background:var(--l);border:2px solid var(--k);border-radius:6px;padding:0 8px;font:800 12px Manrope;margin-right:6px}
.mn{margin-bottom:12px;padding-bottom:10px;border-bottom:2px dashed rgba(30,34,51,.3)}.mn:last-child{border:0}
.def{font-size:14px;opacity:.75;margin:2px 0}.ex{font-size:15px;margin-top:4px}.ex em{display:block;font-size:13px;opacity:.65;font-style:normal}.ex mark{background:var(--y);border-radius:3px;padding:0 2px}
.hint{text-align:center;opacity:.6;font-size:13px;margin:0 0 16px}
textarea,.field{width:100%;font:700 16px Manrope;border:3px solid var(--k);border-radius:12px;padding:10px;background:#fff;color:var(--k);user-select:text;-webkit-user-select:text;margin:6px 0 12px}
code{background:var(--y);border:2px solid var(--k);border-radius:6px;padding:0 5px;font-size:14px}
.log div{padding:3px 0}
.wrow{border-bottom:2px dashed rgba(30,34,51,.3);padding:10px 0;cursor:pointer}.wrow:last-child{border:0}
.wrow .h{display:flex;justify-content:space-between;align-items:center;gap:8px}.wrow .d{display:none;margin-top:8px}.wrow.open .d{display:block}
.lv{display:flex;gap:2px}.lv i{width:7px;height:12px;border:2px solid var(--k);background:var(--c)}.lv i.f{background:var(--b)}
.xdel{background:var(--r);color:#fff;border:2px solid var(--k);border-radius:8px;font:800 18px/1 Manrope;width:30px;height:30px;cursor:pointer;padding:0}
.del{background:var(--r);color:#fff;border:2px solid var(--k);border-radius:8px;font:800 13px Manrope;padding:4px 10px;cursor:pointer;margin-top:8px}
.msgs{height:50vh;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;gap:8px;align-items:flex-end}.m.u{flex-direction:row-reverse}
.m img{height:44px;width:44px;object-fit:cover;object-position:top;border:3px solid var(--k);border-radius:8px;background:var(--l)}
.bub{max-width:78%;border:3px solid var(--k);border-radius:12px;padding:8px 12px;background:#fff;user-select:text;-webkit-user-select:text}.m.u .bub{background:var(--b)}
.tw{border-bottom:2px dotted rgba(30,34,51,.5);cursor:pointer}
.send{display:flex;gap:8px;padding:10px;border-top:3px solid var(--k)}.send .field{margin:0}
.tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom));background:var(--y);border:3px solid var(--k);box-shadow:4px 4px 0 var(--k);border-radius:12px;padding:10px 16px;z-index:5;max-width:90%;text-align:center}
.set{display:flex;justify-content:space-between;align-items:center;padding:8px 0;gap:10px}
.set input[type=checkbox]{width:26px;height:26px;accent-color:var(--k)}
.pop{position:fixed;left:50%;top:30%;transform:translateX(-50%);font:16px 'Press Start 2P',monospace;color:var(--c);-webkit-text-stroke:0;text-shadow:3px 3px 0 var(--k),-2px -2px 0 var(--k),2px -2px 0 var(--k),-2px 2px 0 var(--k);animation:pp .9s forwards;z-index:9;pointer-events:none}
@keyframes pp{to{transform:translate(-50%,-70px);opacity:0}}
.big-emoji{text-align:center}
.center{text-align:center}
.check{height:34px;background:repeating-conic-gradient(var(--k) 0 25%,var(--c) 0 50%) 0 0/34px 34px;border:3px solid var(--k);border-radius:8px;margin-bottom:16px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">WORD<br>QUEST</div>
    <div class="chips"><div class="chip" id="cs"></div><div class="chip" id="cx"></div></div>
  </header>
  <main id="view"></main>
</div>
<nav id="nav"><div class="bar">
  <button class="nb" data-go="home"><img class="ic" src="assets/pc.png" height="26"><span>Главная</span></button>
  <button class="nb" data-go="words"><img class="ic" src="assets/book.png" height="26"><span>Слова</span></button>
  <div class="fab" data-go="add" title="Добавить слова"><img src="assets/pencil.png" alt="" style="width:38px;height:38px;object-fit:contain;image-rendering:pixelated"></div>
  <button class="nb" data-go="chat"><img class="ic" src="assets/bubble.png" height="26"><span>Чат</span></button>
  <button class="nb" data-go="settings"><img class="ic" src="assets/floppy.png" height="26"><span>Настройки</span></button>
</div></nav>
<div id="tip" class="tip" hidden></div>

<script>
/* ================= state ================= */
const LS='wordquest.v1';
const DAY=864e5, INTERVALS=[0,1,2,4,8,16,32,60];   // дни по "коробкам" 0..7, максимум 60 дней — слово не пропадает совсем
const $=s=>document.querySelector(s);
let S=load();
function load(){let s={};try{s=JSON.parse(localStorage[LS]||'{}')}catch(e){}
  if(s.chat)s.chat=s.chat.filter(m=>m.t!=='…'&&m.t!=='...');
  return Object.assign({words:[],chat:[],st:{streak:0,last:'',xp:0}},s,{set:Object.assign({sound:true,tilt:false,flip:false,worker:(window.CONFIG||{}).WORKER_URL||'',pass:'',tutor:'Tutor'},s.set||{})})}
function save(push=true){localStorage[LS]=JSON.stringify(S);if(push)schedulePush();head()}
const live=()=>S.words.filter(w=>!w.del);
const ru=w=>((w.m||[]).find(x=>x.ru)||{}).ru||'?';
const exs=w=>(w.m||[]).flatMap(x=>x.ex||[]);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const ic=(n,h=22)=>`<img class="ic" src="assets/${n}.png" height="${h}" width="${h}" style="object-fit:contain" alt="">`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function view(h){$('#view').innerHTML=h;scrollTo(0,0)}
function head(){$('#cs').innerHTML=ic('flame',22)+S.st.streak;$('#cx').innerHTML=ic('coin',22)+S.st.xp}

/* ================= sound ================= */
let ac;
function tone(f,d=.08,t='square',v=.05,at=0){if(!S.set.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;const t0=ac.currentTime+at;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g).connect(ac.destination);o.start(t0);o.stop(t0+d+.02)}catch(e){}}
const sfx={click:()=>tone(520,.05),flip:()=>tone(400,.06,'triangle',.07),blip:()=>tone(800+Math.random()*250,.025,'square',.012),
 good:()=>{tone(660,.08);tone(880,.14,'square',.05,.08)},bad:()=>{tone(220,.15,'sawtooth',.05);tone(165,.22,'sawtooth',.05,.12)},
 done:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.05,i*.1))};
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
function pop(t){const d=document.createElement('div');d.className='pop';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),900)}

/* ================= tutor (портрет, реплики, взгляд) ================= */
let curEmo='look',lookIdx=4,sayTok=0;
const tFile=e=>e==='look'?`look_${lookIdx}`:`tutor_${e}`;
function setT(e){curEmo=e;const i=$('#tutor');if(i)i.src='assets/'+tFile(e)+'.png'}
function say(text,emo='look'){const el=$('#say');if(!el)return;const tok=++sayTok;let i=0;el.textContent='';
  const t=setInterval(()=>{if(tok!==sayTok||!el.isConnected){clearInterval(t);return}
    el.textContent=text.slice(0,++i);if(i%3===0)sfx.blip();if(i%5===0)setT((i/5)%2?'talk':'smile');
    if(i>=text.length){clearInterval(t);setT(emo);if(emo!=='look')setTimeout(()=>{if(tok===sayTok)setT('look')},1500)}},26)}
function setLook(x,y,th){if(S.set.flip)x=-x;const c=x<-th?0:x>th?2:1,r=y<-th?0:y>th?2:1,k=r*3+c;if(k!==lookIdx){lookIdx=k;if(curEmo==='look')setT('look')}}
addEventListener('pointermove',e=>{if(!$('#tutor'))return;const b=$('#tutor').getBoundingClientRect();setLook((e.clientX-(b.left+b.width/2))/innerWidth*2,(e.clientY-(b.top+b.height*.4))/innerHeight*2,.18)});
addEventListener('deviceorientation',e=>{const s=$('#sens');if(s)s.textContent=e.gamma==null?'нет данных':`наклон: ${Math.round(e.gamma)}° / ${Math.round((e.beta||0)-45)}°`;if(!S.set.tilt||e.gamma==null)return;setLook(e.gamma,(e.beta||0)-45,12)});
async function enableTilt(){
  try{if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){alert('Доступ к наклону не разрешён');return false}}}catch(e){}
  S.set.tilt=true;save(false);return true}

/* ================= SRS ================= */
function answer(w,ok){const now=Date.now();w.seen=(w.seen||0)+1;
  if(ok){w.ok=(w.ok||0)+1;w.box=Math.min(7,(w.box||0)+1);S.st.xp+=10}else{w.bad=(w.bad||0)+1;w.box=Math.max(0,(w.box||0)-3)}
  w.due=ok||w.box>0?now+INTERVALS[w.box]*DAY:now+5*60e3;w.u=now;save();head()}
function pickSession(n){const now=Date.now(),all=live();
  let due=all.filter(w=>(w.due||0)<=now).sort((a,b)=>(a.due||0)-(b.due||0)).slice(0,n);
  if(due.length<n){const rest=all.filter(w=>!due.includes(w));
    const pool=[];rest.forEach(w=>{for(let i=0;i<8-(w.box||0);i++)pool.push(w)});       // чем ниже уровень, тем чаще
    while(due.length<n&&pool.length){const w=pool.splice(Math.random()*pool.length|0,1)[0];if(!due.includes(w))due.push(w)}}
  const mastered=all.filter(w=>(w.box||0)>=6&&!due.includes(w));                          // выученные тоже иногда
  if(n>=8&&mastered.length&&!due.some(w=>(w.box||0)>=6))due[due.length-1]=pick(mastered);
  return shuffle(due)}

/* ================= sync (Cloudflare Worker) ================= */
const canSync=()=>S.set.worker&&S.set.pass;
let syncState='',aiErr='';
async function api(task,body={}){const r=await fetch(S.set.worker,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({task,pass:S.set.pass,...body})});
  const d=await r.json().catch(()=>({}));if(!r.ok||d.error)throw new Error(d.error||('HTTP '+r.status));return d}
function merge(remote){const m=new Map(S.words.map(w=>[w.id,w]));
  remote.forEach(r=>{const l=m.get(r.id);if(!l||(r.u||0)>(l.u||0))m.set(r.id,r)});S.words=[...m.values()]}
let pt;function schedulePush(){clearTimeout(pt);if(canSync())pt=setTimeout(push,1500)}
async function pull(){if(!canSync())return;try{const d=await api('deck_get');merge(d.words||[]);save(false);syncState='ok'}catch(e){syncState='err'}}
async function push(){if(!canSync())return;try{const d=await api('deck_get');merge(d.words||[]);await api('deck_put',{words:S.words});localStorage[LS]=JSON.stringify(S);syncState='ok'}catch(e){syncState='err'}}

/* ================= enrich (перевод, значения, примеры) ================= */
async function enrich(items){
  aiErr='';if(canSync()){try{const d=await api('enrich',{items});if(d.words&&d.words.length)return d.words;aiErr='пустой ответ ИИ'}catch(e){aiErr=String(e.message||e).slice(0,250)}}
  return Promise.all(items.map(fallbackEnrich))}
async function fallbackEnrich({w,ru:given}){let m=[],ipa='',tr=given||'';
  try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));
    if(r.ok){const j=await r.json();ipa=j[0].phonetic||'';m=(j[0].meanings||[]).slice(0,3).map(x=>{const d=x.definitions.find(d=>d.example)||x.definitions[0];return{pos:x.partOfSpeech,ru:'',def:d.definition,ex:d.example?[{en:d.example,ru:''}]:[]}})}}catch(e){}
  if(!tr){try{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair=en|ru');tr=(await r.json()).responseData.translatedText||''}catch(e){}}
  if(!m.length)m=[{pos:'',ru:tr,def:'',ex:[]}];m.forEach(x=>x.ru=tr);return{w,ipa,m}}

/* ================= router ================= */
function go(name,arg){sfx.click();sayTok++;
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.go===name));
  ({home,cards,game:()=>gameMenu(),add,words,chat,settings})[name](arg)}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-act],[data-say]');
  if(!e.target.closest('.tw'))$('#tip').hidden=true;
  if(!t)return;
  if(t.dataset.say){e.stopPropagation();speak(t.dataset.say);return}
  if(t.dataset.go){go(t.dataset.go,t.dataset.arg);return}
  const a=t.dataset.act;
  if(a==='exp'){sfx.click();t.closest('.wrow').classList.toggle('open')}
  if(a==='del'){const w=S.words.find(x=>x.id===t.dataset.id);if(w&&confirm('Удалить «'+w.w+'»?')){w.del=true;w.u=Date.now();save();words()}}
  if(a==='tilt'){enableTilt().then(ok=>{if(ok)settings()})}
  if(a==='testai'){const o=$('#aitest');o.textContent='…';api('chat',{msgs:[{r:'u',t:'Say hi in five words.'}],words:[]}).then(d=>o.textContent='✓ ИИ отвечает: '+d.reply).catch(e=>o.textContent='✗ '+String(e.message||e).slice(0,300))}
  if(a==='sync'){syncState='…';settings();push().then(()=>settings())}
});
document.addEventListener('change',e=>{const k=e.target.dataset.set;if(!k)return;S.set[k]=e.target.type==='checkbox'?e.target.checked:e.target.value.trim();save(false);if(k==='sound'&&S.set.sound)sfx.click()});

/* ================= HOME ================= */
function home(){const L=live(),due=L.filter(w=>(w.due||0)<=Date.now()).length;
  view(`<div class="win"><div class="tb"><span>${esc(S.set.tutor)}.exe</span><span class="dots"><i></i><i></i><i></i></span></div>
   <div class="stage"><img id="tutor" class="portrait" src="assets/look_${lookIdx}.png" alt=""><img class="cat" src="assets/${due?'cat_idle':'cat_sleep'}.png" alt=""></div></div>
   <div class="dlg"><div class="nm">${esc(S.set.tutor)}</div><div id="say"></div></div>
   <div class="row"><button class="btn big" data-go="game">▶ Играть</button><button class="btn big pink" data-go="cards">Карточки</button></div>
   <div class="note">${ic('book',20)} На повторение сегодня: <b>${due}</b> из ${L.length}</div>`);
  curEmo='look';
  if(!L.length)say('Привет! Добавь первые слова: нажми на жёлтый плюс внизу.','wink');
  else if(due)say(pick([`Сегодня ждут ${due} слов. Поехали?`,`Привет! ${due} слов хотят повторения.`]),'smile');
  else say('Всё повторено! Можно сыграть просто ради удовольствия.','wink')}

/* ================= finish ================= */
function finish(kind,ok,total){const t=new Date().toDateString(),y=new Date(Date.now()-DAY).toDateString();
  if(S.st.last!==t){S.st.streak=S.st.last===y?S.st.streak+1:1;S.st.last=t}save();sfx.done();
  const acc=total?Math.round(ok/total*100):0;
  view(`<div class="win"><div class="tb pk"><span>result.exe</span><span class="dots"><i></i><i></i><i></i></span></div><div class="body center">
   ${ic('trophy',90)}<h2 style="margin:8px 0">${acc>=80?'Отлично!':acc>=50?'Неплохо!':'Ничего, повторим!'}</h2>
   <p>Верно: <b>${ok}</b> из ${total} (${acc}%)<br>${ic('coin',20)} +${ok*10} · ${ic('flame',20)} серия: ${S.st.streak}</p>
   <img src="assets/cat_cheer.png" height="110" alt=""></div></div>
   <div class="row"><button class="btn pink" data-go="home">Домой</button><button class="btn" data-go="${kind==='cards'?'cards':'game'}">Ещё раз</button></div>`)}
function notEnough(n=4){view(`<div class="win"><div class="tb"><span>oops.exe</span><span class="dots"><i></i><i></i><i></i></span></div><div class="body center"><img src="assets/cat_think.png" height="110" alt=""><p>Нужно хотя бы <b>${n}</b> слова. Добавь их кнопкой «+» внизу.</p><button class="btn big" data-go="add">Добавить слова</button></div></div>`)}

/* ================= CARDS ================= */
let C;
function cards(){const q=pickSession(15);if(live().length<1)return notEnough(1);C={q,i:0,ok:0};card()}
function card(){if(C.i>=C.q.length)return finish('cards',C.ok,C.q.length);const w=C.q[C.i];
  view(`<div class="win" style="margin-bottom:14px"><div class="prog"><b style="width:${C.i/C.q.length*100}%"></b></div></div>
   <div class="card" id="card"><div class="inner">
    <div class="face front"><small>${C.i+1} / ${C.q.length}</small><h1>${esc(w.w)}</h1><div class="ipa">${esc(w.ipa||'')}</div><button class="sp" data-say="${esc(w.w)}" style="margin-top:10px">${ic('phones',28)}</button></div>
    <div class="face back"><h2 style="margin:0 0 10px">${esc(w.w)}</h2>${meanings(w)}</div></div></div>
   <p class="hint">тап — перевернуть · свайп вправо = знаю, влево = не знаю</p>
   <div class="row"><button class="btn pink" id="no">Не знаю</button><button class="btn blue" id="yes">Знаю</button></div>`);
  const el=$('#card');let x0=0;
  el.onpointerdown=e=>x0=e.clientX;
  el.onpointerup=e=>{const dx=e.clientX-x0;if(dx>70)rate(true);else if(dx<-70)rate(false);else if(Math.abs(dx)<10&&!e.target.closest('.sp')){sfx.flip();el.classList.toggle('flip')}};
  $('#yes').onclick=()=>rate(true);$('#no').onclick=()=>rate(false);
  function rate(ok){answer(w,ok);ok?(C.ok++,sfx.good()):sfx.bad();C.i++;card()}}
function hl(s,w){try{return esc(s).replace(new RegExp('\\b'+reEsc(esc(w))+'\\w{0,3}\\b','ig'),m=>`<mark>${m}</mark>`)}catch(e){return esc(s)}}
function meanings(w){return(w.m||[]).map(x=>`<div class="mn"><span class="pos">${esc(x.pos||'—')}</span><b>${esc(x.ru)}</b>${x.def?`<div class="def">${esc(x.def)}</div>`:''}${(x.ex||[]).map(e=>`<div class="ex">${hl(e.en,w.w)}${e.ru?`<em>${esc(e.ru)}</em>`:''}</div>`).join('')}</div>`).join('')}

/* ================= GAME ================= */
let G;const LINES={good:['Nice!','Точно!','Great job!','Так держать!','Perfect!'],bad:['Ничего, запомним!','Почти! Смотри ответ.','Oops! Бывает.','Повторим ещё раз.'],combo:['Combo! Ты в ударе!','Wow, серия!']};
function gameMenu(){view(`<div class="win"><div class="tb lc"><span>game.exe</span><span class="dots"><i></i><i></i><i></i></span></div><div class="body">
  <p style="margin-top:0"><b>Выбери режим</b></p>
  <div class="opts">
   <button class="opt" data-act="x" onclick="startGame('mix')">${ic('star',22)} Микс (рекомендую)</button>
   <button class="opt" onclick="startGame('choose')">Выбери перевод</button>
   <button class="opt" onclick="startGame('match')">Соедини пары</button>
   <button class="opt" onclick="startGame('type')">Напиши слово</button>
   <button class="opt" onclick="startGame('fill')">Вставь в предложение</button>
  </div></div></div>`)}
function blankOf(w){try{const re=new RegExp('\\b'+reEsc(w.w)+'\\w{0,3}\\b','i');const e=exs(w).find(e=>re.test(e.en));return e?{s:e.en.replace(re,'_____'),ru:e.ru}:null}catch(e){return null}}
function startGame(mode){sfx.click();if(live().length<4)return notEnough();
  const p=pickSession(10);let items=[];
  if(mode==='match'){for(let i=0;i<p.length;i+=5){const g=p.slice(i,i+5);if(g.length>=3)items.push({t:'match',ws:g})}}
  else{let rest=p;if(mode==='mix'&&p.length>=8){items.push({t:'match',ws:p.slice(0,5)});rest=p.slice(5)}
    rest.forEach(w=>items.push({t:mode==='mix'?pick(['choose','choose','type',blankOf(w)?'fill':'choose']):mode,w}))}
  G={items,i:0,ok:0,bad:0,combo:0};q()}
function q(){if(G.i>=G.items.length)return finish('game',G.ok,G.ok+G.bad);
  const it=G.items[G.i];if(it.t==='fill'&&!blankOf(it.w))it.t='choose';
  ({choose:qChoose,fill:qFill,type:qType,match:qMatch})[it.t](it)}
function frame(inner){return`<div class="win"><div class="tb lc"><span>game.exe</span><span>${Math.min(G.i+1,G.items.length)}/${G.items.length}</span></div><div class="prog"><b style="width:${G.i/G.items.length*100}%"></b></div><div class="body">${inner}</div></div>
  <div class="fb"><img id="mt" src="assets/tutor_neutral.png" alt=""><div id="mtx">Погнали!</div><img id="gc" class="gcat" src="assets/cat_idle.png" alt=""></div>`}
function fb(emo,txt,cat){$('#mt').src=`assets/tutor_${emo}.png`;$('#mtx').textContent=txt;$('#gc').src=`assets/cat_${cat}.png`}
function res(w,ok,it){answer(w,ok);
  if(ok){G.ok++;G.combo++;sfx.good();pop('+10');fb(G.combo>=3?'wow':pick(['smile','wink']),G.combo>=3?pick(LINES.combo):pick(LINES.good),G.combo>=3?'cheer':'happy')}
  else{G.bad++;G.combo=0;sfx.bad();fb('think',pick(LINES.bad),'sad');if(!it.re&&it.t!=='match')G.items.push({...it,re:true})}}
function nextBtn(w){$('#nx').innerHTML=`<div class="ans">${esc(w.w)} — ${esc(ru(w))}</div><button class="btn big w" id="nextb">Дальше →</button>`;$('#nextb').onclick=()=>{G.i++;q()}}
function optsQ(it,prompt,opts,lab){const w=it.w;
  view(frame(`${prompt}<div class="opts">${opts.map(x=>`<button class="opt" data-id="${x.id}">${esc(lab(x))}</button>`).join('')}</div><div id="nx"></div>`));
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const ok=b.dataset.id===w.id;
    document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.dataset.id===w.id)o.classList.add('ok')});if(!ok)b.classList.add('no');
    res(w,ok,it);if(ok)setTimeout(()=>{G.i++;q()},850);else nextBtn(w)})}
function qChoose(it){const w=it.w,rev=Math.random()<.4,lab=x=>rev?x.w:ru(x);
  const others=shuffle(live().filter(x=>x.id!==w.id&&lab(x)!==lab(w))).slice(0,3);
  optsQ(it,`<div class="q"><small>${rev?'Как по-английски?':'Что значит?'}</small><h2>${esc(rev?ru(w):w.w)}</h2>${rev?'':`<div class="ipa">${esc(w.ipa||'')} <button class="sp" data-say="${esc(w.w)}">${ic('phones',20)}</button></div>`}</div>`,shuffle([w,...others]),lab)}
function qFill(it){const w=it.w,b=blankOf(w),others=shuffle(live().filter(x=>x.id!==w.id)).slice(0,3);
  optsQ(it,`<div class="q"><small>Вставь подходящее слово</small><h2 style="font-size:22px">${esc(b.s)}</h2>${b.ru?`<div class="ipa">${esc(b.ru)}</div>`:''}</div>`,shuffle([w,...others]),x=>x.w)}
function qType(it){const w=it.w,pos=(w.m[0]||{}).pos;
  view(frame(`<div class="q"><small>Напиши по-английски</small><h2>${esc(ru(w))}</h2><div class="ipa">${esc(pos||'')} · ${esc(w.w[0])}${' _'.repeat(Math.max(0,w.w.length-1))}</div></div>
   <input id="inp" class="inp" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
   <div class="row"><button class="btn pink" id="idk">Не знаю</button><button class="btn" id="chk">Проверить</button></div><div id="nx"></div>`));
  const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N}' ]/gu,'').trim(),inp=$('#inp');inp.focus();
  let done=false;const check=skip=>{if(done)return;done=true;const ok=!skip&&norm(inp.value)===norm(w.w);inp.disabled=true;$('#chk').disabled=$('#idk').disabled=true;
    inp.style.background=ok?'var(--g)':'var(--r)';res(w,ok,it);if(ok)setTimeout(()=>{G.i++;q()},850);else nextBtn(w)};
  $('#chk').onclick=()=>check(false);$('#idk').onclick=()=>check(true);inp.onkeydown=e=>{if(e.key==='Enter')check(false)}}
function qMatch(it){const L=shuffle(it.ws),R=shuffle(it.ws),bad=new Set();let sel=null,done=0;
  view(frame(`<div class="q"><small>Соедини пары</small></div><div class="mt"><div class="col">${L.map(w=>`<button class="opt" data-s="l" data-id="${w.id}">${esc(w.w)}</button>`).join('')}</div><div class="col">${R.map(w=>`<button class="opt" data-s="r" data-id="${w.id}">${esc(ru(w))}</button>`).join('')}</div></div>`));
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sfx.click();
    if(b.dataset.s==='l'){document.querySelectorAll('.opt[data-s=l]').forEach(o=>o.classList.remove('sel'));sel=b;b.classList.add('sel');return}
    if(!sel)return;
    if(sel.dataset.id===b.dataset.id){[sel,b].forEach(o=>{o.classList.remove('sel');o.classList.add('done');o.disabled=true});sel=null;done++;sfx.good();
      if(done===it.ws.length){it.ws.forEach(w=>res(w,!bad.has(w.id),it));setTimeout(()=>{G.i++;q()},900)}}
    else{bad.add(sel.dataset.id);bad.add(b.dataset.id);[sel,b].forEach(o=>{o.classList.add('shake');setTimeout(()=>o.classList.remove('shake'),300)});sel.classList.remove('sel');sel=null;sfx.bad();fb('think','Не то. Попробуй ещё!','sad')}})}

/* ================= ADD WORDS ================= */
function parseLines(t){return t.split('\n').map(s=>s.trim()).filter(Boolean).map(l=>{const m=l.match(/^(.+?)(?:\s[-–—]\s|\s*[:=]\s*)(.+)$/);return m?{w:m[1].trim(),ru:m[2].trim()}:{w:l}})}
function add(){view(`<div class="win"><div class="tb pk"><span>add_words.exe</span><span class="dots"><i></i><i></i><i></i></span></div><div class="body">
  <p style="margin-top:0">Вставь слова с урока, <b>по одному на строку</b>. Перевод, значения и примеры подтянутся сами. Свой перевод можно дать так: <code>run into - столкнуться</code></p>
  <textarea id="ta" rows="8" placeholder="serendipity&#10;to wander&#10;run into - столкнуться"></textarea>
  <button class="btn big w" id="addgo">Добавить слова</button><div class="log" id="log" style="margin-top:12px"></div></div></div>`);
  $('#addgo').onclick=async()=>{sfx.click();const known=new Set(live().map(w=>w.w.toLowerCase()));
    const items=parseLines($('#ta').value).filter((x,i,a)=>!known.has(x.w.toLowerCase())&&a.findIndex(y=>y.w.toLowerCase()===x.w.toLowerCase())===i);
    if(!items.length){$('#log').innerHTML='Нет новых слов 🤷';return}
    $('#addgo').disabled=true;$('#log').innerHTML=`<img src="assets/cat_think.png" height="60" alt=""><div id="lg"></div>`;
    const lg=$('#lg');items.forEach(x=>lg.innerHTML+=`<div id="w_${esc(x.w)}">… ${esc(x.w)}</div>`);
    let n=0;
    for(let i=0;i<items.length;i+=10){const chunk=items.slice(i,i+10);const got=await enrich(chunk);
      got.forEach((g,j)=>{const w=g.w||chunk[j].w;if(!g.m||!g.m.length)g.m=[{pos:'',ru:chunk[j].ru||'?',def:'',ex:[]}];
        S.words.push({id:uid(),w:chunk[j].w,ipa:g.ipa||'',m:g.m,box:0,due:0,seen:0,ok:0,bad:0,u:Date.now()});n++;
        const el=[...lg.children][i+j];if(el)el.innerHTML=`✓ ${esc(chunk[j].w)} — ${esc(ru(S.words[S.words.length-1]))}`})}
    save();sfx.done();if(aiErr&&canSync())$('#log').insertAdjacentHTML('beforeend',`<div class="ans" style="background:var(--p)">ИИ не ответил, слова разобраны обычным словарём (без примеров с переводом). Причина: ${esc(aiErr)}</div>`);$('#log').firstChild.src='assets/cat_happy.png';$('#log').insertAdjacentHTML('beforeend',`<div class="ans">Добавлено: ${n}</div><button class="btn w" data-go="words">К словарю</button>`);$('#addgo').disabled=false;$('#ta').value=''}}

/* ================= WORDS ================= */
function words(){const L=live().sort((a,b)=>b.u-a.u);
  view(`<div class="win"><div class="tb"><span>dictionary.exe</span><span>${L.length}</span></div><div class="body">
   <input class="field" id="srch" placeholder="Поиск…" style="margin-top:0">
   <div id="wl"></div></div></div>`);
  const draw=f=>{$('#wl').innerHTML=L.filter(w=>!f||(w.w+ru(w)).toLowerCase().includes(f)).map(w=>`<div class="wrow"><div class="h" data-act="exp"><div><b style="font-size:18px">${esc(w.w)}</b> <span style="opacity:.7">— ${esc(ru(w))}</span></div><div style="display:flex;align-items:center;gap:8px"><div class="lv">${Array.from({length:7},(_,i)=>`<i class="${i<(w.box||0)?'f':''}"></i>`).join('')}</div><button class="xdel" data-act="del" data-id="${w.id}" title="Удалить">×</button></div></div>
    <div class="d"><button class="sp" data-say="${esc(w.w)}">${ic('phones',20)}</button> <span class="ipa">${esc(w.ipa||'')}</span>${meanings(w)}<button class="del" data-act="del" data-id="${w.id}">Удалить</button></div></div>`).join('')||'<p class="center">Пока пусто</p>'};
  draw('');$('#srch').oninput=e=>draw(e.target.value.toLowerCase().trim())}

/* ================= CHAT ================= */
function wrapWords(t){return esc(t).replace(/[A-Za-z][A-Za-z'’-]*/g,m=>`<span class="tw">${m}</span>`)}
function chat(){if(!S.chat.length)S.chat.push({r:'a',t:"Hi! Let's chat in English. How was your day?"});
  view(`<div class="win"><div class="tb lc"><span>chat.exe</span><span class="dots"><i></i><i></i><i></i></span></div><div class="msgs" id="msgs"></div>
   <div class="send"><input class="field" id="cin" placeholder="Write in English…" autocomplete="off"><button class="btn" id="csend">→</button></div></div>
   <p class="hint">тапни на любое английское слово — покажу перевод в контексте</p>`);
  drawMsgs();$('#csend').onclick=send;$('#cin').onkeydown=e=>{if(e.key==='Enter')send()};
  $('#msgs').onclick=async e=>{const t=e.target.closest('.tw');if(!t)return;sfx.click();const tip=$('#tip');tip.hidden=false;tip.textContent='…';
    const word=t.textContent,sent=t.closest('.bub').textContent;
    try{if(canSync()){const d=await api('context',{word,sentence:sent});tip.innerHTML=`<b>${esc(word)}</b> → ${esc(d.ru)}${d.note?`<br><small>${esc(d.note)}</small>`:''}`}
      else{const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(word)+'&langpair=en|ru');tip.innerHTML=`<b>${esc(word)}</b> → ${esc((await r.json()).responseData.translatedText)}`}}
    catch(err){tip.textContent='Ошибка: '+String(err.message||err).slice(0,200)}}}
function drawMsgs(){const m=$('#msgs');if(!m)return;m.innerHTML=S.chat.slice(-40).map(x=>`<div class="m ${x.r==='u'?'u':''}"><img src="assets/${x.r==='u'?'me_happy':'look_4'}.png" alt=""><div class="bub">${x.r==='a'?wrapWords(x.t):esc(x.t)}</div></div>`).join('');m.scrollTop=m.scrollHeight}
async function send(){const inp=$('#cin'),t=inp.value.trim();if(!t)return;inp.value='';sfx.click();S.chat.push({r:'u',t});drawMsgs();
  if(!canSync()){S.chat.push({r:'a',t:'Connect the Worker in Settings, and I can answer you!'});save(false);drawMsgs();return}
  S.chat.push({r:'a',t:'…'});drawMsgs();
  try{const ws=shuffle(live()).sort((a,b)=>(a.box||0)-(b.box||0)).slice(0,10).map(w=>w.w);
    const d=await api('chat',{msgs:S.chat.slice(0,-1).slice(-12).map(x=>({r:x.r,t:x.t})),words:ws});S.chat[S.chat.length-1].t=d.reply}
  catch(e){S.chat[S.chat.length-1].t='Oops: '+String(e.message||e).slice(0,300)}
  save(false);drawMsgs()}

/* ================= SETTINGS ================= */
function settings(){const st=syncState==='ok'?'✓ подключено':syncState==='err'?'✗ ошибка':syncState==='…'?'…':canSync()?'не проверено':'выключено (данные только на этом устройстве)';
  view(`<div class="win"><div class="tb"><span>settings.exe</span><span class="dots"><i></i><i></i><i></i></span></div><div class="body">
   <label class="set"><span>Звуки</span><input type="checkbox" data-set="sound" ${S.set.sound?'checked':''}></label>
   <div class="set"><span>Наклон телефона (взгляд)</span><button class="btn" data-act="tilt">${S.set.tilt?'включён ✓':'Включить'}</button></div><p id="sens" style="font-size:13px;margin:0 0 8px;opacity:.7">датчик: жду…</p>
   <label class="set"><span>Поменять лево/право у взгляда</span><input type="checkbox" data-set="flip" ${S.set.flip?'checked':''}></label>
   <label>Имя репетитора<input class="field" data-set="tutor" value="${esc(S.set.tutor)}"></label>
   <hr style="border:0;border-top:3px dashed var(--k);margin:12px 0">
   <b>Общий словарь и ИИ</b><p style="font-size:14px;margin:4px 0">Нужен Cloudflare Worker (см. README). Одинаковый адрес и пароль у тебя и у репетитора.</p>
   <label>Адрес Worker<input class="field" data-set="worker" value="${esc(S.set.worker)}" placeholder="https://….workers.dev"></label>
   <label>Пароль<input class="field" type="password" data-set="pass" value="${esc(S.set.pass)}"></label>
   <button class="btn w" data-act="sync">Синхронизировать</button><button class="btn w lilac" data-act="testai" style="margin-top:10px">Проверить ИИ</button><p id="aitest" style="font-size:14px;margin:6px 0"></p><p style="font-size:14px">Статус: ${st}</p></div></div>`)}

/* ================= start ================= */
head();document.querySelector('[data-go=home]').classList.add('on');home();pull().then(()=>{head();if($('#tutor'))home()});
</script>
